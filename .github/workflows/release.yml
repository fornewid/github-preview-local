# Builds gh-prv-local for each platform. A pushed tag vX.Y.Z (scripts/release.sh makes it) publishes
# the binaries, each with its SHA-256, as the GitHub release vX.Y.Z; scripts/install.sh installs
# from there. Started by hand (workflow_dispatch), it only tests and builds.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Versions match the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          plugin=$(jq -r .version plugin/.claude-plugin/plugin.json)
          echo "Cargo.toml $version, plugin.json $plugin, ref $GITHUB_REF_NAME"
          [ "$version" = "$plugin" ] || { echo "::error::Cargo.toml and plugin.json versions differ"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1
          fi
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: npm --prefix ui ci --no-audit --no-fund && npm --prefix ui run typecheck && npm --prefix ui run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, asset: gh-prv-local-darwin-arm64 }
          - { os: macos-15, target: x86_64-apple-darwin, asset: gh-prv-local-darwin-x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: gh-prv-local-linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: gh-prv-local-linux-arm64 }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, asset: gh-prv-local-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: npm --prefix ui ci --no-audit --no-fund && npm --prefix ui run build
      - name: Build
        shell: bash
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --target "$TARGET"
          exe="src-tauri/target/$TARGET/release/gh-prv-local"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          mkdir dist
          cp "$exe" "dist/$ASSET"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET"; else shasum -a 256 "$ASSET"; fi > "$ASSET.sha256"
          cat "$ASSET.sha256"
      - name: Runs
        # The Intel macOS binary is cross-built on an Apple silicon runner.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: '"dist/$ASSET" --version'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          # Notes: the commits since the previous release (for a release, the previous release that
          # is not a pre-release).
          exclude=()
          [[ "$TAG" == *-* ]] || exclude=(--exclude 'v*-*')
          if prev=$(git describe --tags --abbrev=0 --match 'v*' "${exclude[@]}" "$TAG^" 2>/dev/null); then
            git log --no-merges --format='- %s' "$prev..$TAG" > notes.md
          else
            echo 'First release.' > notes.md
          fi
          pre=()
          [[ "$TAG" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md "${pre[@]}"
