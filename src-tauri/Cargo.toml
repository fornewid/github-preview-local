[package]
name = "gh-prv-local"
version = "0.2.2"
edition = "2021"
description = "Preview your branch as a GitHub pull request, locally — no web server, no round-trips to GitHub."
license = "MIT"
repository = "https://github.com/fornewid/github-preview-local"
default-run = "gh-prv-local"

[[bin]]
name = "gh-prv-local"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.3"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Embed the UI (ui/dist) into the binary. Required for release builds.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Self-test only: keep the WebView running while its window is not visible (see main.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKPreferences", "WKWebViewConfiguration"] }
